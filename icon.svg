<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Dumbbell icon -->
  <g transform="translate(256, 256)">
    <!-- Left weight -->
    <rect x="-200" y="-60" width="60" height="120" rx="10" fill="white"/>
    <rect x="-180" y="-70" width="20" height="140" rx="5" fill="url(#accent)"/>
    
    <!-- Bar -->
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="white"/>
    
    <!-- Right weight -->
    <rect x="140" y="-60" width="60" height="120" rx="10" fill="white"/>
    <rect x="160" y="-70" width="20" height="140" rx="5" fill="url(#accent)"/>
  </g>
  
  <!-- Heart rate line at bottom -->
  <path d="M 100 420 L 140 420 L 160 390 L 180 440 L 200 400 L 220 420 L 412 420" 
        stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
