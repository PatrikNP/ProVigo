    <!-- Firebase LocalStorage Wrapper -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCZjOBDcyyLMQZDeQPKK0bpdRSh3prLs0M",
            authDomain: "patrikapps-cd169.firebaseapp.com",
            databaseURL: "https://patrikapps-cd169-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "patrikapps-cd169",
            storageBucket: "patrikapps-cd169.firebasestorage.app",
            messagingSenderId: "334803684499",
            appId: "1:334803684499:web:13c0f00c357ad5c97ed166"
        };

        // Wait for Firebase to load, then initialize
        let db;
        let isFirebaseReady = false;
        const localStorageCache = {};
        
        function initializeFirebase() {
            if (typeof firebase === 'undefined') {
                console.log('⏳ Waiting for Firebase...');
                setTimeout(initializeFirebase, 100);
                return;
            }
            
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseReady = true;
                console.log('✅ Firebase connected');
                
                // MIGRATION: Move old localStorage data to Firebase once
                const migrated = originalLocalStorage.getItem('provigo_migrated_to_firebase');
                if (!migrated) {
                    console.log('🔄 Migrating localStorage to Firebase...');
                    
                    // Copy all existing localStorage to Firebase
                    const invalidChars = /[.#$\[\]\/]/; // Firebase doesn't allow these in keys
                    
                    for (let i = 0; i < originalLocalStorage.length; i++) {
                        const key = originalLocalStorage.key(i);
                        
                        // Skip if: device ID, migration flag, or contains invalid chars, or is Firebase internal
                        if (key && 
                            key !== 'proVigo_deviceId' && 
                            key !== 'provigo_migrated_to_firebase' &&
                            !key.startsWith('firebase:') &&
                            !invalidChars.test(key)) {
                            
                            const value = originalLocalStorage.getItem(key);
                            localStorageCache[key] = value;
                            db.ref(`provigo/localStorage/${key}`).set(value);
                            console.log(`✅ Migrated: ${key}`);
                        } else if (key) {
                            console.log(`⏭️ Skipped: ${key} (invalid or internal)`);
                        }
                    }
                    
                    originalLocalStorage.setItem('provigo_migrated_to_firebase', 'true');
                    console.log('✅ Migration complete!');
                }
                
                // Create sync status indicator in header
                window.addEventListener('DOMContentLoaded', () => {
                    const header = document.querySelector('.header p');
                    if (header) {
                        const syncStatus = document.createElement('div');
                        syncStatus.style.cssText = 'display: inline-flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.2); color: #6ee7b7; padding: 6px 12px; border-radius: 15px; font-size: 0.85em; margin-left: 10px;';
                        syncStatus.innerHTML = '<span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor;"></span>Firebase Synkad';
                        header.appendChild(syncStatus);
                    }
                });
                
                // Load all data from Firebase on startup - FIREBASE IS TRUTH
                db.ref('provigo/localStorage').once('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    
                    // CLEAR local cache and use ONLY Firebase data
                    Object.keys(localStorageCache).forEach(key => delete localStorageCache[key]);
                    Object.assign(localStorageCache, data);
                    
                    console.log('📦 Loaded data from Firebase (source of truth)');
                    console.log(`📊 Found ${Object.keys(data).length} keys in Firebase`);
                    
                    // Trigger a render update if the app is already loaded
                    if (typeof render === 'function') {
                        render();
                    }
                });
                
                // Listen for changes from other devices - ALWAYS SYNC
                db.ref('provigo/localStorage').on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    
                    console.log('🔄 Firebase data received:', Object.keys(data).length, 'keys');
                    
                    // Always replace cache with Firebase data
                    Object.keys(localStorageCache).forEach(key => delete localStorageCache[key]);
                    Object.assign(localStorageCache, data);
                    
                    console.log('✅ Cache updated with Firebase data');
                    
                    // Force reload workouts from cache
                    if (typeof loadWorkouts === 'function') {
                        console.log('🔄 Calling loadWorkouts()...');
                        loadWorkouts();
                    }
                    
                    // Force re-render
                    if (typeof render === 'function') {
                        console.log('🔄 Calling render()...');
                        render();
                    }
                    
                    // Trigger storage event
                    window.dispatchEvent(new Event('storage'));
                    
                    console.log('🔄 Sync complete!');
                });
                
            } catch (error) {
                console.error('❌ Firebase init error:', error);
            }
        }
        
        // Start initialization
        initializeFirebase();

        // Override localStorage to use Firebase - FIREBASE IS ALWAYS SOURCE OF TRUTH
        const originalLocalStorage = window.localStorage;
        window.localStorage = {
            getItem: function(key) {
                // Keep device ID in actual localStorage
                if (key === 'proVigo_deviceId' || key === 'provigo_migrated_to_firebase') {
                    return originalLocalStorage.getItem(key);
                }
                
                // ALWAYS return from Firebase cache (which is synced in real-time)
                const value = localStorageCache[key];
                if (value !== undefined && value !== null) {
                    return value;
                }
                return null;
            },
            setItem: function(key, value) {
                // Keep device ID and migration flag in actual localStorage
                if (key === 'proVigo_deviceId' || key === 'provigo_migrated_to_firebase') {
                    originalLocalStorage.setItem(key, value);
                    return;
                }
                
                // Skip Firebase internal keys
                if (key.startsWith('firebase:')) {
                    return;
                }
                
                // Validate key (Firebase doesn't allow . # $ [ ] /)
                const invalidChars = /[.#$\[\]\/]/;
                if (invalidChars.test(key)) {
                    console.warn(`⚠️ Invalid key "${key}" - contains forbidden characters`);
                    return;
                }
                
                // Update cache immediately
                localStorageCache[key] = value;
                
                // Save to Firebase (source of truth)
                if (isFirebaseReady) {
                    console.log(`📤 Saving ${key} to Firebase...`);
                    db.ref(`provigo/localStorage/${key}`).set(value).then(() => {
                        console.log(`✅ Saved ${key} to Firebase successfully!`);
                    }).catch(err => {
                        console.error(`❌ Firebase save error for ${key}:`, err);
                    });
                } else {
                    console.warn('⚠️ Firebase not ready, data not saved!');
                }
            },
            removeItem: function(key) {
                delete localStorageCache[key];
                if (isFirebaseReady) {
                    db.ref(`provigo/localStorage/${key}`).remove().catch(err => {
                        console.error('Firebase remove error:', err);
                    });
                }
            },
            clear: function() {
                Object.keys(localStorageCache).forEach(key => {
                    delete localStorageCache[key];
                });
                if (isFirebaseReady) {
                    db.ref('provigo/localStorage').remove();
                }
            },
            key: function(index) {
                return Object.keys(localStorageCache)[index] || null;
            },
            get length() {
                return Object.keys(localStorageCache).length;
            }
        };
    </script>

            font-size: 1.5em;

        .running-phase h4 {

        .running-phase p {

            opacity: 0.95;

        @media (max-width: 600px) {
            .header h1 {

            .workout-button {
                font-size: 1em;

    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const workoutPrograms = {
            push: {
                name: "Push (Bröst, Axlar, Triceps)",
                exercises: [
                    { name: "Bänkpress (Levergym)", sets: 3, reps: "10-12", hasWeight: true },
                    { name: "Incline Hantelpress", sets: 3, reps: "10-12", hasWeight: true },
                    { name: "Shoulder Press (Levergym)", sets: 3, reps: "10-12", hasWeight: true },
                    { name: "Sidohävningar Hantlar", sets: 3, reps: "12-15", hasWeight: true },
                    { name: "Dips (Levergym)", sets: 3, reps: "8-12", hasWeight: false },
                    { name: "Triceps Pushdown (Levergym)", sets: 3, reps: "12-15", hasWeight: true },
                    { name: "Hantel Triceps Extensions", sets: 3, reps: "10-12", hasWeight: true }
                ]
            },
            pull: {
                name: "Pull (Rygg, Biceps)",
                exercises: [
                    { name: "Lat Pulldown (Levergym)", sets: 3, reps: "10-12", hasWeight: true },
                    { name: "Rodd (Levergym)", sets: 3, reps: "10-12", hasWeight: true },
                    { name: "Chins/Pull-ups (Chinsstång)", sets: 3, reps: "Max", hasWeight: false },
                    { name: "Hantel Rodd", sets: 3, reps: "10-12 per arm", hasWeight: true },
                    { name: "Face Pulls (Levergym)", sets: 3, reps: "15-20", hasWeight: true },
                    { name: "Biceps Curl (Hantel)", sets: 3, reps: "10-12", hasWeight: true },
                    { name: "Hammer Curls (Hantel)", sets: 3, reps: "10-12", hasWeight: true }
                ]
            },
            legs: {
                name: "Ben & Core",
                exercises: [
                    { name: "Leg Press (Levergym)", sets: 4, reps: "12-15", hasWeight: true },
                    { name: "Knäböj med Hantlar", sets: 3, reps: "12-15", hasWeight: true },
                    { name: "Rumänska Marklyft (Hantel)", sets: 3, reps: "10-12", hasWeight: true },
                    { name: "Leg Curls (Levergym)", sets: 3, reps: "12-15", hasWeight: true },
                    { name: "Utfall med Hantlar", sets: 3, reps: "10-12 per ben", hasWeight: true },
                    { name: "Vadpress (Levergym)", sets: 3, reps: "15-20", hasWeight: true },
                    { name: "Ab Wheel Rollouts (Iron Gym Speed ABS)", sets: 3, reps: "8-12", hasWeight: false },
                    { name: "Plank", sets: 3, reps: "45-60 sek", hasWeight: false },
                    { name: "Russian Twists (Hantel)", sets: 3, reps: "20 totalt", hasWeight: true }
                ]
            },
            running: {
                name: "Löpning - Intervallträning",
                isRunning: true,
                fields: [
                    { name: "Distans (km)", key: "distance", type: "number", required: true },
                    { name: "Tid (min)", key: "time", type: "number", required: true },
                    { name: "Genomsnittspuls (bpm)", key: "avgHr", type: "number", required: false }
                ],
                phases: [
                    { name: "Uppvärmning", duration: "5 minuter", description: "Lätt jogg för att värma upp" },
                    { name: "Intervaller", duration: "20 minuter", description: "2 min springa (högre tempo) → 1 min gå (vila). Upprepa cirka 6-7 gånger" },
                    { name: "Nedvarvning", duration: "5 minuter", description: "Lätt jogg för att varva ner" }
                ],
                zwiftNote: "Detta program kan köras i Zwift med deras intervallfunktion. Totaltid: 30 minuter"
            }
        };

        let currentView = 'menu';
        let selectedWorkout = null;
        let completedWorkouts = [];
        let editingDate = null;
        let workoutHistory = [];
        let currentExerciseLog = {}; // Store logged exercises for current workout
        let editMode = null; // 'quick' or 'detailed'
        let pendingWorkoutType = null;
        let statsOpen = false; // Track if stats section is open
        let currentTab = 'workout'; // 'workout' or 'meals'
        let userSettings = {
            bodyWeight: 75 // Default body weight in kg
        };
        let weightLog = []; // Track weight over time
        let eatenMeals = {}; // Track which planned meals have been eaten: { 'YYYY-MM-DD': { breakfast: true, lunch: false, ... } }
        let dailySnacks = {}; // Track multiple snacks per day: { 'YYYY-MM-DD': [{ index: 0, eaten: true }, { index: 2, eaten: false }] }

        // Get today's calories eaten
        function getTodayCaloriesEaten() {
            const today = new Date().toISOString().split('T')[0];
            const todayMeals = eatenMeals[today] || { breakfast: false, lunch: false, dinner: false, evening: false, snack: false };
            
            let totalKcal = 0;
            const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            const todayDayIndex = new Date().getDay();
            const dayKey = days[todayDayIndex === 0 ? 6 : todayDayIndex - 1]; // Adjust for Sunday
            
            if (todayMeals.breakfast) {
                totalKcal += mealAlternatives.breakfast[currentMealSelections[dayKey].breakfast].kcal;
            }
            if (todayMeals.lunch) {
                totalKcal += mealAlternatives.lunch[currentMealSelections[dayKey].lunch].kcal;
            }
            if (todayMeals.dinner) {
                totalKcal += mealAlternatives.dinner[currentMealSelections[dayKey].dinner].kcal;
            }
            if (todayMeals.evening) {
                totalKcal += mealAlternatives.evening[currentMealSelections[dayKey].evening].kcal;
            }
            
            // Add snacks (all snacks count)
            const todaySnacks = dailySnacks[today] || [];
            todaySnacks.forEach(snack => {
                totalKcal += mealAlternatives.snack[snack.index].kcal;
            });
            
            return totalKcal;
        }
        
        // Get today's protein eaten
        function getTodayProteinEaten() {
            const today = new Date().toISOString().split('T')[0];
            const todayMeals = eatenMeals[today] || { breakfast: false, lunch: false, dinner: false, evening: false, snack: false };
            
            let totalProtein = 0;
            const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            const todayDayIndex = new Date().getDay();
            const dayKey = days[todayDayIndex === 0 ? 6 : todayDayIndex - 1]; // Adjust for Sunday
            
            if (todayMeals.breakfast) {
                totalProtein += mealAlternatives.breakfast[currentMealSelections[dayKey].breakfast].protein;
            }
            if (todayMeals.lunch) {
                totalProtein += mealAlternatives.lunch[currentMealSelections[dayKey].lunch].protein;
            }
            if (todayMeals.dinner) {
                totalProtein += mealAlternatives.dinner[currentMealSelections[dayKey].dinner].protein;
            }
            if (todayMeals.evening) {
                totalProtein += mealAlternatives.evening[currentMealSelections[dayKey].evening].protein;
            }
            
            // Add snacks protein
            const todaySnacks = dailySnacks[today] || [];
            todaySnacks.forEach(snack => {
                totalProtein += mealAlternatives.snack[snack.index].protein;
            });
            
            return totalProtein;
        }
        
        // Get today's calories burned
        function getTodayCaloriesBurned() {
            const today = new Date();
            const todayWorkouts = completedWorkouts.filter(w => {
                const workoutDate = new Date(w.date);
                return workoutDate.toDateString() === today.toDateString();
            });
            
            let totalBurned = 0;
            todayWorkouts.forEach(w => {
                totalBurned += calculateWorkoutCalories(w);
            });
            
            return totalBurned;
        }

        // Load saved workouts
        function loadWorkouts() {
            const saved = loadFromProfile('workoutLog');
            if (saved) {
                completedWorkouts = saved;
            }
            const historySaved = loadFromProfile('workoutHistory');
            if (historySaved) {
                workoutHistory = historySaved;
            }
            const settingsSaved = loadFromProfile('userSettings');
            if (settingsSaved) {
                userSettings = settingsSaved;
            }
            const weightSaved = loadFromProfile('weightLog');
            if (weightSaved) {
                weightLog = weightSaved;
            }
            const eatenSaved = loadFromProfile('eatenMeals');
            if (eatenSaved) {
                eatenMeals = eatenSaved;
            }
            const snacksSaved = loadFromProfile('dailySnacks');
            if (snacksSaved) {
                dailySnacks = snacksSaved;
            }
            const customMealsSaved = loadFromProfile('mealAlternatives');
            if (customMealsSaved) {
                mealAlternatives = customMealsSaved;
            }
            
            // Migration: Add evening meal to existing data if missing
            const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            const mealSelectionsSaved = loadFromProfile('mealSelections');
            if (mealSelectionsSaved) {
                currentMealSelections = mealSelectionsSaved;
            }
            days.forEach(day => {
                if (currentMealSelections[day] && currentMealSelections[day].evening === undefined) {
                    currentMealSelections[day].evening = 0;
                }
            });
            saveToProfile('mealSelections', currentMealSelections);
        }

        // Toggle exercise expansion
        function toggleExercise(index) {
            const element = document.getElementById(`exercise-${index}`);
            const isExpanded = element.classList.contains('expanded');
            
            // Close all other exercises
            document.querySelectorAll('.exercise-log-form').forEach(el => {
                el.classList.remove('expanded');
            });
            
            if (!isExpanded) {
                element.classList.add('expanded');
                // Focus on reps input
                setTimeout(() => {
                    const repsInput = document.getElementById(`reps-${index}`);
                    if (repsInput) repsInput.focus();
                }, 100);
            }
        }

        // Save exercise data
        function saveExerciseLog(index) {
            const workout = workoutPrograms[selectedWorkout];
            const exercise = workout.exercises[index];
            
            const sets = [];
            
            if (exercise.hasWeight) {
                // Weight-based exercise - save both weight and reps per set
                for (let i = 0; i < exercise.sets; i++) {
                    const weight = document.getElementById(`weight-${index}-${i}`)?.value || '';
                    const reps = document.getElementById(`reps-${index}-${i}`)?.value || '';
                    if (weight && reps) {
                        sets.push({
                            set: i + 1,
                            weight: weight,
                            reps: reps
                        });
                    }
                }
            } else {
                // Bodyweight exercise - store reps per set
                for (let i = 0; i < exercise.sets; i++) {
                    const reps = document.getElementById(`reps-${index}-${i}`)?.value || '';
                    if (reps) {
                        sets.push({
                            set: i + 1,
                            reps: reps,
                            weight: '' // No weight for bodyweight
                        });
                    }
                }
            }
            
            if (sets.length > 0) {
                currentExerciseLog[index] = {
                    exercise: exercise.name,
                    sets: sets,
                    isBodyweight: !exercise.hasWeight
                };
            }
            
            // Close the exercise
            document.getElementById(`exercise-${index}`).classList.remove('expanded');
            render();
        }

        // Check if exercise is logged
        function isExerciseLogged(index) {
            return currentExerciseLog.hasOwnProperty(index);
        }

        // Save workout with optional exercise log
        function completeWorkout(workoutType, exerciseLog = null) {
            const newWorkout = {
                type: workoutType,
                date: new Date().toISOString(),
                name: workoutPrograms[workoutType].name,
                exerciseLog: exerciseLog
            };
            completedWorkouts.push(newWorkout);
            
            if (exerciseLog) {
                workoutHistory.push(newWorkout);
                saveToProfile('workoutHistory', workoutHistory);
            }
            
            saveToProfile('workoutLog', completedWorkouts);
            currentView = 'menu';
            selectedWorkout = null;
            currentExerciseLog = {};
            render();
        }

        // Get previous workout data for same type
        function getPreviousWorkout(workoutType) {
            const previous = workoutHistory
                .filter(w => w.type === workoutType && w.exerciseLog)
                .reverse();
            return previous.length > 0 ? previous[0] : null;
        }

        // Complete workout with logging
        function completeWithLog() {
            const log = Object.values(currentExerciseLog);
            completeWorkout(selectedWorkout, log.length > 0 ? log : null);
        }

        // Skip logging and just mark complete
        function skipLogging() {
            currentExerciseLog = {};
            completeWorkout(selectedWorkout, null);
        }

        // Add workout to specific date
        function addWorkoutToDate(workoutType, date, exerciseLog = null) {
            const newWorkout = {
                type: workoutType,
                date: date.toISOString(),
                name: workoutPrograms[workoutType].name,
                exerciseLog: exerciseLog
            };
            completedWorkouts.push(newWorkout);
            
            if (exerciseLog) {
                workoutHistory.push(newWorkout);
                saveToProfile('workoutHistory', workoutHistory);
            }
            
            saveToProfile('workoutLog', completedWorkouts);
            
            // Reload page to ensure clean state
            location.reload();
        }

        // Complete workout from edit mode
        function completeEditWorkout() {
            const log = Object.values(currentExerciseLog);
            const dateToUse = editingDate || new Date();
            
            // Save workout
            const newWorkout = {
                type: selectedWorkout,
                date: dateToUse.toISOString(),
                name: workoutPrograms[selectedWorkout].name,
                exerciseLog: log.length > 0 ? log : null
            };
            completedWorkouts.push(newWorkout);
            
            if (log.length > 0) {
                workoutHistory.push(newWorkout);
                saveToProfile('workoutHistory', workoutHistory);
            }
            
            saveToProfile('workoutLog', completedWorkouts);
            
            // Reload page to ensure clean state
            location.reload();
        }

        // Delete workout
        function deleteWorkout(index) {
            completedWorkouts.splice(index, 1);
            saveToProfile('workoutLog', completedWorkouts);
            if (editingDate) {
                openEditModal(editingDate);
            }
            render();
        }

        // Open stats section for a specific date
        function openStatsModal(date) {
            const dayWorkouts = completedWorkouts
                .map((w, index) => ({ ...w, originalIndex: index }))
                .filter(w => {
                    const workoutDate = new Date(w.date);
                    workoutDate.setHours(0, 0, 0, 0);
                    const compareDate = new Date(date);
                    compareDate.setHours(0, 0, 0, 0);
                    return workoutDate.getTime() === compareDate.getTime();
                });
            
            if (dayWorkouts.length === 0) {
                openEditModal(date);
                return;
            }
            
            editingDate = date;
            statsOpen = true;
            const statsSection = document.getElementById('statsSection');
            const dateStr = date.toLocaleDateString('sv-SE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            // Calculate total calories for the day
            const totalCalories = dayWorkouts.reduce((sum, workout) => sum + calculateWorkoutCalories(workout), 0);
            
            let workoutsHtml = `
                <div class="stats-header">
                    <h2>${dateStr}</h2>
                    ${totalCalories > 0 ? `<div style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 8px 15px; border-radius: 10px; font-size: 1em; font-weight: 700; margin-top: 8px; display: inline-block;">🔥 Totalt: ${totalCalories} kcal</div>` : ''}
                </div>
            `;
            
            dayWorkouts.forEach(workout => {
                const typeLabel = workout.type === 'running' ? '🏃 Löpning' :
                                 workout.type === 'push' ? '🏋️ Push' :
                                 workout.type === 'pull' ? '💪 Pull' : '🦵 Ben & Core';
                const typeClass = workout.type === 'running' ? 'running' : '';
                
                // Calculate calories for this workout
                const calories = calculateWorkoutCalories(workout);
                
                workoutsHtml += `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div class="stats-workout-type ${typeClass}">${typeLabel}</div>
                        ${calories > 0 ? `<div style="background: #f59e0b; color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.8em; font-weight: 600;">🔥 ${calories} kcal</div>` : ''}
                    </div>
                `;
                
                if (workout.exerciseLog && workout.exerciseLog.length > 0) {
                    workoutsHtml += `<div class="exercises-grid">`;
                    
                    workout.exerciseLog.forEach(exercise => {
                        // Calculate calories for this exercise
                        const exerciseCalories = calculateExerciseCalories(exercise);
                        
                        workoutsHtml += `
                            <div class="exercise-stats-item">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <h4 style="margin: 0;">${exercise.exercise}</h4>
                                    ${exerciseCalories > 0 ? `<span style="background: #f59e0b; color: white; padding: 3px 8px; border-radius: 5px; font-size: 0.7em; font-weight: 700;">🔥 ${exerciseCalories}</span>` : ''}
                                </div>
                        `;
                        
                        if (exercise.sets && exercise.sets.length > 0) {
                            // Check if exercise has weights
                            const hasWeights = exercise.sets[0].weight && exercise.sets[0].weight !== '';
                            
                            if (hasWeights) {
                                // Show sets as list with weight and reps per set
                                workoutsHtml += `<div class="sets-list">`;
                                exercise.sets.forEach((set, idx) => {
                                    const weight = parseFloat(set.weight) || 0;
                                    const reps = set.reps || exercise.reps || '?';
                                    workoutsHtml += `
                                        <div class="set-row set-${idx + 1}">
                                            <span class="set-number">Set ${idx + 1}:</span>
                                            <span class="set-data">${weight}kg × ${reps} reps</span>
                                        </div>
                                    `;
                                });
                                workoutsHtml += `</div>`;
                            } else {
                                // Bodyweight exercise - check if we have per-set reps
                                if (exercise.isBodyweight && exercise.sets && exercise.sets[0].reps) {
                                    // Show per-set reps
                                    const isTimeBased = exercise.sets[0].reps.toLowerCase().includes('sek') || exercise.sets[0].reps.toLowerCase().includes('min');
                                    const unit = isTimeBased ? ' sek' : ' reps';
                                    
                                    workoutsHtml += `<div class="sets-list">`;
                                    exercise.sets.forEach((set, idx) => {
                                        workoutsHtml += `
                                            <div class="set-row set-${idx + 1}">
                                                <span class="set-number">Set ${idx + 1}:</span>
                                                <span class="set-data">${set.reps}${unit}</span>
                                            </div>
                                        `;
                                    });
                                    workoutsHtml += `</div>`;
                                } else {
                                    // Old format - single reps value
                                    const isTimeBased = exercise.reps.toLowerCase().includes('sek') || exercise.reps.toLowerCase().includes('min');
                                    const unit = isTimeBased ? '' : ' reps';
                                    workoutsHtml += `
                                        <div class="no-weight-exercise">
                                            💪 ${exercise.reps}${unit} × ${exercise.sets.length} sets
                                        </div>
                                    `;
                                }
                            }
                        }
                        
                        workoutsHtml += `</div>`;
                    });
                    
                    workoutsHtml += `</div>`; // Close exercises-grid
                } else if (workout.type === 'running') {
                    workoutsHtml += `
                        <div class="exercise-stats-item">
                            <h4>Löpning</h4>
                    `;
                    
                    // Running data is stored directly in exerciseLog (not in an array)
                    if (workout.exerciseLog && (workout.exerciseLog.distance || workout.exerciseLog.time)) {
                        const data = workout.exerciseLog;
                        workoutsHtml += `<div class="sets-list">`;
                        
                        if (data.distance) {
                            workoutsHtml += `
                                <div class="set-row set-1">
                                    <span class="set-number">Distans:</span>
                                    <span class="set-data">${data.distance} km</span>
                                </div>
                            `;
                        }
                        if (data.time) {
                            workoutsHtml += `
                                <div class="set-row set-2">
                                    <span class="set-number">Tid:</span>
                                    <span class="set-data">${data.time} min</span>
                                </div>
                            `;
                        }
                        if (data.avgHr && data.avgHr !== null) {
                            workoutsHtml += `
                                <div class="set-row set-3">
                                    <span class="set-number">Snitt-puls:</span>
                                    <span class="set-data">${data.avgHr} bpm</span>
                                </div>
                            `;
                        }
                        
                        workoutsHtml += `</div>`;
                    } else {
                        workoutsHtml += `
                            <div class="no-weight-exercise">
                                🏃 Löpning genomförd (ingen detaljerad loggning)
                            </div>
                        `;
                    }
                    
                    workoutsHtml += `</div>`;
                } else {
                    workoutsHtml += `
                        <div class="exercise-stats-item">
                            <div class="no-weight-exercise">
                                ✓ Träning genomförd (ingen detaljerad loggning)
                            </div>
                        </div>
                    `;
                }
            });
            
            workoutsHtml += `
                <div class="stats-actions">

        // Open edit modal for a specific date
        function openEditModal(date) {
            editingDate = date;
            editMode = null;
            pendingWorkoutType = null;
            
            const dayWorkouts = completedWorkouts
                .map((w, index) => ({ ...w, originalIndex: index }))
                .filter(w => {
                    const workoutDate = new Date(w.date);
                    workoutDate.setHours(0, 0, 0, 0);
                    const compareDate = new Date(date);
                    compareDate.setHours(0, 0, 0, 0);
                    return workoutDate.getTime() === compareDate.getTime();
                });
            
            const modal = document.getElementById('editModal');
            const dateStr = date.toLocaleDateString('sv-SE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            document.getElementById('modalDate').textContent = dateStr;
            
            let existingHtml = '';
            if (dayWorkouts.length > 0) {
                existingHtml = '<div class="existing-workouts"><h3>Registrerade pass:</h3>';

            document.getElementById('existingWorkouts').innerHTML = existingHtml;
            modal.classList.add('show');

        // Get week statistics
        function getWeekStats() {
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const weekWorkouts = completedWorkouts.filter(w => new Date(w.date) >= weekAgo);
            
            const strength = weekWorkouts.filter(w => ['push', 'pull', 'legs'].includes(w.type)).length;
            const running = weekWorkouts.filter(w => w.type === 'running').length;
            
            // Calculate total calories for the week
            const calories = weekWorkouts.reduce((sum, w) => sum + calculateWorkoutCalories(w), 0);
            
            return { total: weekWorkouts.length, strength, running, calories };
        }

        // Get last 14 days for calendar
        function getLast14Days() {
            const days = [];
            const today = new Date();
            
            for (let i = 13; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                date.setHours(0, 0, 0, 0);
                
                const dayWorkouts = completedWorkouts.filter(w => {
                    const workoutDate = new Date(w.date);
                    workoutDate.setHours(0, 0, 0, 0);
                    return workoutDate.getTime() === date.getTime();
                });
                
                days.push({
                    date: date,
                    dayName: date.toLocaleDateString('sv-SE', { weekday: 'short' }),
                    dayNumber: date.getDate(),
                    isToday: date.toDateString() === today.toDateString(),
                    workouts: dayWorkouts,
                    isCompleted: dayWorkouts.length > 0
                });
            }
            
            return days;
        }

        // Render calendar section
        function renderCalendar() {
            const days = getLast14Days();
            const week1 = days.slice(0, 7);
            const week2 = days.slice(7, 14);
            
            function renderWeek(weekDays, weekLabel) {
                let html = `<div class="week-label">${weekLabel}</div><div class="calendar-grid">`;
                
                weekDays.forEach(day => {
                    let classes = 'calendar-day';
                    if (day.isCompleted) classes += ' completed';
                    if (day.isToday) classes += ' today';
                    
                    const dateStr = day.date.toISOString();
                    html += `<div class="${classes}" onclick='openStatsModal(new Date("${dateStr}"))'>`;
                    html += `<div class="calendar-day-name">${day.dayName}</div>`;
                    html += `<div class="calendar-day-number">${day.dayNumber}</div>`;
                    
                    if (day.isCompleted) {
                        html += `<div class="checkmark">✓</div>`;
                        
                        // Calculate total calories for the day
                        const dayCalories = day.workouts.reduce((sum, w) => sum + calculateWorkoutCalories(w), 0);
                        
                        day.workouts.forEach(w => {
                            const badgeClass = w.type === 'running' ? 'running' : '';
                            const label = w.type === 'running' ? 'Löp' : 
                                         w.type === 'push' ? 'Push' :
                                         w.type === 'pull' ? 'Pull' : 'Ben';
                            html += `<div class="workout-type-badge ${badgeClass}">${label}</div>`;
                        });
                        
                        // Show calories if any
                        if (dayCalories > 0) {
                            html += `<div style="font-size: 0.65em; color: #f59e0b; font-weight: 700; margin-top: 3px;">🔥 ${dayCalories}</div>`;
                        }
                    }
                    
                    html += `</div>`;
                });
                
                html += '</div>';
                return html;
            }
            
            const today = new Date();
            const weekAgo = new Date(today);
            weekAgo.setDate(weekAgo.getDate() - 7);
            
            return `
                <div class="calendar-section">
                    <h3>📅 Senaste 2 veckorna</h3>
                    ${renderWeek(week1, `Vecka ${getWeekNumber(weekAgo)}`)}
                    ${renderWeek(week2, `Vecka ${getWeekNumber(today)}`)}
                </div>
                <div id="statsSection" class="stats-section"></div>
            `;
        }

        // Get ISO week number
        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        // Complete running workout with logging
        function completeRunningWorkout() {
            const workout = workoutPrograms.running;
            const log = {};
            
            workout.fields.forEach(field => {
                const value = document.getElementById(`running-${field.key}`)?.value;
                if (value) {
                    log[field.key] = value;
                }
            });
            
            // Get manual calories if provided
            const manualCalories = document.getElementById('running-calories')?.value;
            
            // Check if we have at least distance and time (required fields)
            const hasRequiredData = log.distance && log.time;
            
            // Store running data directly as exerciseLog
            const exerciseLog = hasRequiredData ? {
                distance: parseFloat(log.distance),
                time: parseFloat(log.time),
                avgHr: log.avgHr ? parseFloat(log.avgHr) : null,
                manualCalories: manualCalories ? parseFloat(manualCalories) : null
            } : null;
            
            const dateToUse = (currentView === 'workout-edit' && editingDate) ? editingDate : new Date();
            
            const newWorkout = {
                type: 'running',
                date: dateToUse.toISOString(),
                name: workoutPrograms.running.name,
                exerciseLog: exerciseLog
            };
            completedWorkouts.push(newWorkout);
            
            if (exerciseLog) {
                workoutHistory.push(newWorkout);
                saveToProfile('workoutHistory', workoutHistory);
            }
            
            saveToProfile('workoutLog', completedWorkouts);
            
            // Reload page to ensure clean state
            location.reload();
        }

        // Profile system
        let currentProfile = localStorage.getItem('currentProfile') || 'default';

        // Get all profiles
        function getAllProfiles() {
            const profiles = new Set();
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.includes('_')) {
                    const profile = key.split('_')[0];
                    if (profile !== 'migrated' && profile !== 'currentProfile') {
                        profiles.add(profile);
                    }
                }
            }
            // Always include current profile and default
            profiles.add(currentProfile);
            profiles.add('default');
            return Array.from(profiles).sort();
        }

        // Get profile-specific key
        function getProfileKey(key) {
            return `${currentProfile}_${key}`;
        }

        // Save data with profile prefix
        function saveToProfile(key, data) {
            localStorage.setItem(getProfileKey(key), JSON.stringify(data));
        }

        // Load data with profile prefix
        function loadFromProfile(key) {
            const data = localStorage.getItem(getProfileKey(key));
            return data ? JSON.parse(data) : null;
        }

        // Delete entire profile
        function deleteProfile(profileName) {
            const keys = Object.keys(localStorage);
            keys.forEach(key => {
                if (key.startsWith(`${profileName}_`)) {
                    localStorage.removeItem(key);
                }
            });
        }

        // Rename profile
        function renameProfile(oldName, newName) {
            const keys = Object.keys(localStorage);
            keys.forEach(key => {
                if (key.startsWith(`${oldName}_`)) {
                    const data = localStorage.getItem(key);
                    const newKey = key.replace(`${oldName}_`, `${newName}_`);
                    localStorage.setItem(newKey, data);
                    localStorage.removeItem(key);
                }
            });
            if (currentProfile === oldName) {
                currentProfile = newName;
                localStorage.setItem('currentProfile', newName);
            }
        }

        window.exportData = function() {
            const exportData = {
                profile: currentProfile,
                workoutLog: completedWorkouts,
                workoutHistory: workoutHistory,
                userSettings: userSettings,
                weightLog: weightLog,
                eatenMeals: eatenMeals,
                dailySnacks: dailySnacks,
                mealSelections: currentMealSelections,
                mealAlternatives: mealAlternatives,
                exportDate: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const fileName = `ProVigo_${currentProfile}_${new Date().toISOString().split('T')[0]}.json`;
            
            // Try File System Access API first (Chrome/Edge) - allows choosing location
            if (window.showSaveFilePicker) {
                const opts = {
                    suggestedName: fileName,
                    types: [{
                        description: 'ProVigo Export',
                        accept: {'application/json': ['.json']},
                    }],
                };
                
                window.showSaveFilePicker(opts)
                    .then(function(fileHandle) {
                        return fileHandle.createWritable();
                    })
                    .then(function(writable) {
                        writable.write(dataBlob);
                        return writable.close();
                    })
                    .then(function() {
                        alert(`📥 Data exporterad!`);
                    })
                    .catch(function(err) {
                        // User cancelled or error - fall back to regular download
                        if (err.name !== 'AbortError') {
                            console.log('Save picker error:', err);
                            regularDownload(dataBlob, fileName);
                        }
                    });
            } else {
                // Fallback for Safari and other browsers - regular download
                regularDownload(dataBlob, fileName);
            }
        }
        
        function regularDownload(dataBlob, fileName) {
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(url);
            
            alert(`📥 Data exporterad!\n\nFilen sparad i Nedladdningar:\n${fileName}`);
        }

        window.importData = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        
                        if (confirm(`Importera data från profil "${importedData.profile}"?\n\n✅ Träning & Mellanmål läggs ihop\n✅ Måltider slås samman\n✅ Senaste vägning per dag behålls\n✅ Nya recept läggs till\n\nExisterande data BEHÅLLS och sammanfogas!`)) {
                            
                            try {
                                // MERGE WORKOUTS - Add all imported workouts
                                const importedWorkouts = importedData.workoutLog || [];
                                for (let i = 0; i < importedWorkouts.length; i++) {
                                    const workout = importedWorkouts[i];
                                    // Simple duplicate check - only exact matches
                                    let exists = false;
                                    for (let j = 0; j < completedWorkouts.length; j++) {
                                        if (completedWorkouts[j].type === workout.type && 
                                            completedWorkouts[j].date === workout.date) {
                                            exists = true;
                                            break;
                                        }
                                    }
                                    if (!exists) {
                                        completedWorkouts.push(workout);
                                    }
                                }
                                
                                // MERGE WORKOUT HISTORY
                                const importedHistory = importedData.workoutHistory || {};
                                for (const key in importedHistory) {
                                    if (!workoutHistory[key]) {
                                        workoutHistory[key] = [];
                                    }
                                    const historyWorkouts = importedHistory[key];
                                    for (let i = 0; i < historyWorkouts.length; i++) {
                                        const workout = historyWorkouts[i];
                                        let exists = false;
                                        for (let j = 0; j < workoutHistory[key].length; j++) {
                                            if (workoutHistory[key][j].type === workout.type && 
                                                workoutHistory[key][j].date === workout.date) {
                                                exists = true;
                                                break;
                                            }
                                        }
                                        if (!exists) {
                                            workoutHistory[key].push(workout);
                                        }
                                    }
                                }
                                
                                // MERGE USER SETTINGS
                                if (importedData.userSettings && importedData.userSettings.bodyWeight) {
                                    userSettings.bodyWeight = importedData.userSettings.bodyWeight;
                                }
                                
                                // MERGE WEIGHT LOG - Keep latest per day
                                const importedWeightLog = importedData.weightLog || [];
                                const weightByDate = {};
                                
                                for (let i = 0; i < weightLog.length; i++) {
                                    const entry = weightLog[i];
                                    const date = entry.date.split('T')[0];
                                    if (!weightByDate[date]) {
                                        weightByDate[date] = entry;
                                    } else {
                                        if (new Date(entry.date) > new Date(weightByDate[date].date)) {
                                            weightByDate[date] = entry;
                                        }
                                    }
                                }
                                
                                for (let i = 0; i < importedWeightLog.length; i++) {
                                    const entry = importedWeightLog[i];
                                    const date = entry.date.split('T')[0];
                                    if (!weightByDate[date]) {
                                        weightByDate[date] = entry;
                                    } else {
                                        if (new Date(entry.date) > new Date(weightByDate[date].date)) {
                                            weightByDate[date] = entry;
                                        }
                                    }
                                }
                                
                                weightLog = [];
                                for (const date in weightByDate) {
                                    weightLog.push(weightByDate[date]);
                                }
                                
                                // MERGE EATEN MEALS
                                const importedEatenMeals = importedData.eatenMeals || {};
                                for (const dateKey in importedEatenMeals) {
                                    if (!eatenMeals[dateKey]) {
                                        eatenMeals[dateKey] = {};
                                    }
                                    for (const mealType in importedEatenMeals[dateKey]) {
                                        eatenMeals[dateKey][mealType] = eatenMeals[dateKey][mealType] || importedEatenMeals[dateKey][mealType];
                                    }
                                }
                                
                                // MERGE MEAL ALTERNATIVES - Only custom meals (DO THIS FIRST!)
                                const snackIndexMapping = {}; // Map old indices to new indices
                                
                                if (importedData.mealAlternatives) {
                                    const mealTypes = ['breakfast', 'lunch', 'dinner', 'evening', 'snack'];
                                    for (let t = 0; t < mealTypes.length; t++) {
                                        const mealType = mealTypes[t];
                                        if (importedData.mealAlternatives[mealType]) {
                                            const importedMeals = importedData.mealAlternatives[mealType];
                                            for (let i = 0; i < importedMeals.length; i++) {
                                                const importedMeal = importedMeals[i];
                                                
                                                // For snacks, create index mapping
                                                if (mealType === 'snack') {
                                                    // Check if this meal already exists
                                                    let existingIndex = -1;
                                                    for (let j = 0; j < mealAlternatives.snack.length; j++) {
                                                        if (mealAlternatives.snack[j].name === importedMeal.name) {
                                                            existingIndex = j;
                                                            break;
                                                        }
                                                    }
                                                    
                                                    if (existingIndex >= 0) {
                                                        // Meal exists - map old index to existing index
                                                        snackIndexMapping[i] = existingIndex;
                                                    } else if (importedMeal.isCustom) {
                                                        // Custom meal doesn't exist - add it and map to new index
                                                        mealAlternatives.snack.push(importedMeal);
                                                        snackIndexMapping[i] = mealAlternatives.snack.length - 1;
                                                    } else {
                                                        // Standard meal - map to same index (should already exist)
                                                        snackIndexMapping[i] = i;
                                                    }
                                                } else {
                                                    // For other meal types, just add if custom and doesn't exist
                                                    if (importedMeal.isCustom) {
                                                        let exists = false;
                                                        for (let j = 0; j < mealAlternatives[mealType].length; j++) {
                                                            if (mealAlternatives[mealType][j].name === importedMeal.name && 
                                                                mealAlternatives[mealType][j].isCustom) {
                                                                exists = true;
                                                                break;
                                                            }
                                                        }
                                                        if (!exists) {
                                                            mealAlternatives[mealType].push(importedMeal);
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                                
                                // MERGE DAILY SNACKS - Use index mapping
                                const importedDailySnacks = importedData.dailySnacks || {};
                                for (const dateKey in importedDailySnacks) {
                                    if (!dailySnacks[dateKey]) {
                                        dailySnacks[dateKey] = [];
                                    }
                                    const snacks = importedDailySnacks[dateKey];
                                    for (let i = 0; i < snacks.length; i++) {
                                        const oldIndex = snacks[i].index;
                                        const newIndex = snackIndexMapping[oldIndex];
                                        if (newIndex !== undefined) {
                                            dailySnacks[dateKey].push({ index: newIndex });
                                        } else {
                                            // Fallback - use old index (shouldn't happen)
                                            dailySnacks[dateKey].push(snacks[i]);
                                        }
                                    }
                                }
                                
                                // MERGE MEAL SELECTIONS
                                const importedMealSelections = importedData.mealSelections || {};
                                for (const day in importedMealSelections) {
                                    if (!currentMealSelections[day]) {
                                        currentMealSelections[day] = {};
                                    }
                                    for (const mealType in importedMealSelections[day]) {
                                        currentMealSelections[day][mealType] = importedMealSelections[day][mealType];
                                    }
                                }
                                
                                // Save all
                                saveToProfile('workoutLog', completedWorkouts);
                                saveToProfile('workoutHistory', workoutHistory);
                                saveToProfile('userSettings', userSettings);
                                saveToProfile('weightLog', weightLog);
                                saveToProfile('eatenMeals', eatenMeals);
                                saveToProfile('dailySnacks', dailySnacks);
                                saveToProfile('mealSelections', currentMealSelections);
                                saveToProfile('mealAlternatives', mealAlternatives);
                                
                                alert('✅ Data sammanfogad!\n\n📊 Träning & mellanmål ihopslagna\n🍽️ Måltider sammanslagna\n⚖️ Senaste vägningar behållna\n\nAppen laddas om.');
                                location.reload();
                                
                            } catch (mergeError) {
                                alert('❌ Fel vid sammanslagning: ' + mergeError.message);
                                console.error('Merge error:', mergeError);
                            }
                        }
                    } catch (error) {
                        alert('❌ Fel: Kunde inte läsa filen. ' + error.message);
                        console.error('Parse error:', error);
                    }
                };
                reader.readAsText(file);
            };
            
            input.click();
        }

        // Switch between workout and meals tab
        window.switchTab = function(tab) {
            currentTab = tab;
            render();
        }

        // Toggle day expansion
        window.toggleDay = function(day) {
            const mealsDiv = document.getElementById(`meals-${day}`);

                const expandedDays = JSON.parse(localStorage.getItem('expandedDays') || '[]');
                if (!expandedDays.includes(day)) {
                    expandedDays.push(day);
                    localStorage.setItem('expandedDays', JSON.stringify(expandedDays));
                }
            } else {
                mealsDiv.style.display = 'none';
                arrow.textContent = '▼';
                // Remove from expanded state
                const expandedDays = JSON.parse(localStorage.getItem('expandedDays') || '[]');
                const index = expandedDays.indexOf(day);
                if (index > -1) {
                    expandedDays.splice(index, 1);
                    localStorage.setItem('expandedDays', JSON.stringify(expandedDays));
                }
            }
        }

        // Alternative meal options (10 options per meal type)
        let mealAlternatives = {
            breakfast: [
                {
                    name: "Äggröra med Skinka",

                },
                {

            // Add eaten snacks (all snacks count)
            const todaySnacks = dailySnacks[dateKey] || [];

            // Calculate planned for today (without snacks, they are dynamic)

            const plannedKcal = breakfastMeal.kcal + lunchMeal.kcal + dinnerMeal.kcal + eveningMeal.kcal;
            const plannedProtein = breakfastMeal.protein + lunchMeal.protein + dinnerMeal.protein + eveningMeal.protein;
            
            // Reorder days array to put today first
            const todayIndex = todayDayIndex === 0 ? 6 : todayDayIndex - 1;
            const reorderedDays = [...days.slice(todayIndex), ...days.slice(0, todayIndex)];
            const reorderedDayNames = [...dayNames.slice(todayIndex), ...dayNames.slice(0, todayIndex)];

                mealsHtml += `

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: ${isToday || isExpanded ? '12px' : '0'}; cursor: ${isToday ? 'default' : 'pointer'};" ${!isToday ? `onclick="toggleDay('${day}')"` : ''}>
                            <h3 style="margin: 0; color: #1f2937;">${reorderedDayNames[index]} ${isToday ? '(Idag)' : ''}</h3>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <span style="background: #10b981; color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.85em; font-weight: 700;">💪 ${totalProtein}g</span>
                                <span style="background: #f59e0b; color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.85em; font-weight: 700;">🔥 ${totalKcal} kcal</span>
                                ${!isToday ? `<span id="arrow-${day}" style="font-size: 1.2em;">${isExpanded ? '▲' : '▼'}</span>` : ''}
                            </div>
                        </div>
                        
                        <div id="meals-${day}" style="display: ${isToday || isExpanded ? 'grid' : 'none'}; gap: 10px; margin-top: 12px;">
                            ${renderMeal('🍳 Frukost', breakfastMeal, day, 'breakfast')}
                            ${renderMeal('🥗 Lunch', lunchMeal, day, 'lunch')}
                            ${renderMeal('🍖 Middag', dinnerMeal, day, 'dinner')}
                            ${renderMeal('🌙 Kvällsmål', eveningMeal, day, 'evening')}
                            ${renderSnacks(day)}
                        </div>
                    </div>
                `;
            });
            
            return `
                <div class="container">

                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h1>ProVigo</h1>
                                <p>Träning & Kost</p>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px;"><div style="background: rgba(255,255,255,0.95); padding: 10px 16px; border-radius: 25px; font-size: 0.9em; font-weight: 700; color: #1f2937; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border: 2px solid rgba(255,255,255,0.3);">👤 ${currentProfile}</div><button onclick="openSettings()" style="background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5em; cursor: pointer; color: white;">
                                ⚙️
                            </button>

                    <div class="card">
                        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                            <button onclick="switchTab('workout')" style="flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95em; cursor: pointer; background: ${currentTab === 'workout' ? 'linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%)' : '#e5e7eb'}; color: ${currentTab === 'workout' ? 'white' : '#6b7280'};">
                                💪 Träning
                            </button>
                            <button onclick="switchTab('meals')" style="flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95em; cursor: pointer; background: ${currentTab === 'meals' ? 'linear-gradient(135deg, #10b981 0%, #059669 100%)' : '#e5e7eb'}; color: ${currentTab === 'meals' ? 'white' : '#6b7280'};">
                                🍽️ Kost
                            </button>
                        </div>
                        
                        <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                            <h2 style="margin: 0 0 10px 0;">📊 Idag (${reorderedDayNames[0]})</h2>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                                <div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; text-align: center;">
                                    <div style="font-size: 1.5em; font-weight: 700;">${eatenKcal}</div>
                                    <div style="font-size: 0.85em;">Ätit (kcal)</div>
                                </div>
                                <div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; text-align: center;">
                                    <div style="font-size: 1.5em; font-weight: 700;">${plannedKcal}</div>
                                    <div style="font-size: 0.85em;">Planerat (kcal)</div>
                                </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">

                            <button onclick="showShoppingList()" style="background: white; color: #059669; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; margin-top: 12px; cursor: pointer; width: 100%; margin-bottom: 8px;">

                                ⏮️ Tidigare dagar

                        </div>
                        
                        ${mealsHtml}
                    </div>
                </div>
            `;
        }

        // Render single meal
        // Render multiple snacks for a day
        function renderSnacks(day) {
            const today = new Date();
            const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            const todayDayIndex = today.getDay();
            const todayKey = days[todayDayIndex === 0 ? 6 : todayDayIndex - 1];
            const isToday = day === todayKey;
            const dateKey = today.toISOString().split('T')[0];
            
            // Get snacks for this day
            const daySnacks = (isToday && dailySnacks[dateKey]) ? dailySnacks[dateKey] : [];
            
            // Calculate total snack calories and protein (all snacks count)
            let totalSnackKcal = 0, totalSnackProtein = 0;
            daySnacks.forEach(snack => {
                const meal = mealAlternatives.snack[snack.index];
                totalSnackKcal += meal.kcal;
                totalSnackProtein += meal.protein;
            });
            
            return `
                <div style="background: ${isToday ? '#fef3c7' : '#fffbeb'}; padding: 12px; border-radius: 8px; border: ${isToday ? '3px solid #f59e0b' : '2px solid #fbbf24'}; cursor: ${isToday ? 'pointer' : 'default'};" ${isToday ? `onclick="showSnackManager('${dateKey}')"` : ''}>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="font-weight: 700; color: #1f2937; font-size: 1em;">
                            🥤 Mellanmål ${daySnacks.length > 0 ? `(${daySnacks.length})` : ''}
                        </div>
                        ${isToday ? `
                            <div style="font-size: 0.75em; color: #92400e;">
                                ${totalSnackKcal} kcal • ${totalSnackProtein}g protein
                            </div>
                        ` : ''}
                    </div>
                    ${isToday && daySnacks.length > 0 ? `
                        <div style="margin-top: 8px; font-size: 0.85em; color: #78350f;">
                            ${daySnacks.map(snack => {
                                const meal = mealAlternatives.snack[snack.index];
                                return `<div style="margin-bottom: 4px;">• ${meal.name} <span style="font-size: 0.85em; color: #92400e;">(P: ${meal.protein}g • K: ${meal.carbs}g • F: ${meal.fat}g • ${meal.kcal} kcal)</span></div>`;
                            }).join('')}
                        </div>
                    ` : ''}
                    ${isToday ? `
                        <div style="margin-top: 6px; font-size: 0.75em; color: #92400e; font-style: italic;">
                            💡 Klicka för att hantera mellanmål
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderMeal(label, meal, day, mealType) {
            const mealId = meal.name.replace(/\s/g, '-');
            
            // Check if this is today's meal
            const today = new Date();
            const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            const todayDayIndex = today.getDay();
            const todayKey = days[todayDayIndex === 0 ? 6 : todayDayIndex - 1];
            const isToday = day === todayKey;
            
            // Get today's date key for eaten tracking
            const dateKey = today.toISOString().split('T')[0];
            const isEaten = eatenMeals[dateKey] && eatenMeals[dateKey][mealType];
            
            return `
                <div style="background: ${isToday && isEaten ? '#d1fae5' : '#f8f9fa'}; padding: 12px; border-radius: 8px; border: ${isToday ? '2px solid #10b981' : 'none'};">
                    ${isToday ? `
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">

                                <input type="checkbox" 
                                       ${isEaten ? 'checked' : ''}

                                       style="width: 20px; height: 20px; cursor: pointer;">
                                <span style="font-weight: 700; color: #1f2937; font-size: 1em;">

                            <button onclick="changeMeal('${day}', '${mealType}')" style="background: #2563eb; color: white; border: none; padding: 4px 10px; border-radius: 5px; font-size: 0.75em; font-weight: 600; cursor: pointer;">
                                Ändra
                            </button>
                        </div>
                    ` : `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <div style="font-weight: 700; color: #1f2937; flex: 1;" onclick="showRecipe('${mealId}', ${JSON.stringify(meal).replace(/"/g, '&quot;')})" style="cursor: pointer;">
                                ${label}: ${meal.name}
                            </div>
                            <button onclick="changeMeal('${day}', '${mealType}')" style="background: #2563eb; color: white; border: none; padding: 4px 10px; border-radius: 5px; font-size: 0.75em; font-weight: 600; cursor: pointer; margin-left: 8px;">
                                Ändra
                            </button>
                        </div>
                    `}
                    <div style="font-size: 0.85em; color: #6b7280;">
                        ⏱️ ${meal.time} • P: ${meal.protein}g • K: ${meal.carbs}g • F: ${meal.fat}g • ${meal.kcal} kcal
                    </div>
                    <div style="font-size: 0.75em; color: #9ca3af; margin-top: 4px; cursor: pointer;" onclick="showRecipe('${mealId}', ${JSON.stringify(meal).replace(/"/g, '&quot;')})">
                        Klicka för recept →
                    </div>
                </div>
            `;
        }

        // Show snack manager modal
        window.showSnackManager = function(dateKey) {
            const daySnacks = dailySnacks[dateKey] || [];
            
            let snackListHtml = '';
            if (daySnacks.length > 0) {
                snackListHtml = daySnacks.map((snack, idx) => {
                    const meal = mealAlternatives.snack[snack.index];
                    return `
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;">
                            <div style="flex: 1; cursor: pointer;" onclick="event.stopPropagation(); showRecipe('snack-daily-${idx}', ${JSON.stringify(meal).replace(/"/g, '&quot;')})">
                                <div style="font-weight: 700; color: #1f2937;">• ${meal.name}</div>
                                <div style="font-size: 0.85em; color: #6b7280;">${meal.kcal} kcal • ${meal.protein}g protein</div>

                            <button onclick="event.stopPropagation(); removeSnack('${dateKey}', ${idx})" style="background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-size: 0.75em; cursor: pointer;">
                                Ta bort
                            </button>
                        </div>
                    `;
                }).join('');
            } else {
                snackListHtml = '<div style="color: #9ca3af; font-style: italic; text-align: center; padding: 20px;">Inga mellanmål tillagda än</div>';
            }
            
            const modal = `
                <div id="snackModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;" onclick="closeSnackModal()">
                    <div style="background: white; border-radius: 12px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 20px;" onclick="event.stopPropagation()">

                        <div style="margin-bottom: 15px;">
                            ${snackListHtml}
