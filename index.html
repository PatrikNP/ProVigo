                            + Lägg till mellanmål
                        </button>
                        
                        <button onclick="closeSnackModal()" style="width: 100%; padding: 12px; background: #6b7280; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">
                            Stäng
                        </button>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modal);
        }

        // Close snack modal
        window.closeSnackModal = function() {
            const modal = document.getElementById('snackModal');
            if (modal) {
                modal.remove();
            }
        }

        // Add snack to day
        window.addSnackToDay = function(dateKey) {
            closeSnackModal();
            
            // Show snack selection modal
            let optionsHtml = mealAlternatives.snack.map((alt, index) => `
                <div style="background: white; border: 2px solid ${alt.isCustom ? '#10b981' : '#e5e7eb'}; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                    <div style="flex: 1;" onclick="showRecipe('snack-${index}', ${JSON.stringify(alt).replace(/"/g, '&quot;')})" style="cursor: pointer;">
                        <div style="font-weight: 700; color: #1f2937; margin-bottom: 4px;">
                            ${alt.isCustom ? '✏️ ' : ''}${alt.name}
                        </div>
                        <div style="font-size: 0.85em; color: #6b7280;">
                            ⏱️ ${alt.time} • ${alt.kcal} kcal • P: ${alt.protein}g
                        </div>
                        <div style="font-size: 0.75em; color: #9ca3af; margin-top: 4px; cursor: pointer;">
                            Klicka här för recept →
                        </div>
                    </div>
                    ${alt.isCustom ? `
                        <button onclick="event.stopPropagation(); deleteCustomSnack(${index}, '${dateKey}')" style="background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; white-space: nowrap;">
                            🗑️
                        </button>
                    ` : ''}
                    <button onclick="event.stopPropagation(); selectSnackForDay('${dateKey}', ${index})" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; white-space: nowrap;">
                        Välj
                    </button>
                </div>
            `).join('');
            
            const modal = `
                <div id="snackSelectModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1001; padding: 20px;" onclick="closeSnackSelectModal()">
                    <div style="background: white; border-radius: 12px; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 20px;" onclick="event.stopPropagation()">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h2 style="margin: 0; color: #1f2937;">Välj mellanmål</h2>
                            <button onclick="closeSnackSelectModal()" style="background: none; border: none; font-size: 1.5em; cursor: pointer; color: #6b7280;">×</button>
                        </div>
                        ${optionsHtml}
                        <button onclick="addCustomSnack('${dateKey}')" style="width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px;">
                            ✏️ Eget mellanmål
                        </button>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modal);
        }

        // Close snack select modal
        window.closeSnackSelectModal = function() {
            const modal = document.getElementById('snackSelectModal');
            if (modal) {
                modal.remove();
            }
        }

        // Select snack for day
        window.selectSnackForDay = function(dateKey, index) {
            if (!dailySnacks[dateKey]) {
                dailySnacks[dateKey] = [];
            }
            
            dailySnacks[dateKey].push({ index: index });
            saveToProfile('dailySnacks', dailySnacks);
            
            closeSnackSelectModal();
            render();
            showSnackManager(dateKey);
        }

        // Add custom snack
        window.addCustomSnack = function(dateKey) {
            closeSnackSelectModal();
            
            const name = prompt('Namn på mellanmål:');
            if (!name || !name.trim()) return;
            
            const kcal = prompt('Kalorier (kcal):');
            if (!kcal || isNaN(kcal) || kcal <= 0) {
                alert('Ange ett giltigt antal kalorier!');
                return;
            }
            
            const protein = prompt('Protein (g):');
            if (!protein || isNaN(protein) || protein < 0) {
                alert('Ange ett giltigt antal protein!');
                return;
            }
            
            // Create custom snack
            const customSnack = {
                name: name.trim(),
                protein: parseInt(protein),
                carbs: 0,
                fat: 0,
                kcal: parseInt(kcal),
                ingredients: ["Eget mellanmål"],
                time: "-",
                instructions: "Eget mellanmål utan recept",
                isCustom: true
            };
            
            // Add to snack alternatives
            mealAlternatives.snack.push(customSnack);
            saveToProfile('mealAlternatives', mealAlternatives);
            
            // Add to today's snacks
            const newIndex = mealAlternatives.snack.length - 1;
            if (!dailySnacks[dateKey]) {
                dailySnacks[dateKey] = [];
            }
            dailySnacks[dateKey].push({ index: newIndex });
            saveToProfile('dailySnacks', dailySnacks);
            
            render();
            showSnackManager(dateKey);
        }

        // Delete custom snack
        window.deleteCustomSnack = function(index, dateKey) {
            const snack = mealAlternatives.snack[index];
            
            if (!snack.isCustom) {
                alert('Kan bara ta bort egna mellanmål!');
                return;
            }
            
            if (!confirm(`Ta bort "${snack.name}" från listan?\n\nDetta påverkar inte redan loggade mellanmål.`)) {
                return;
            }
            
            // Remove from alternatives
            mealAlternatives.snack.splice(index, 1);
            saveToProfile('mealAlternatives', mealAlternatives);
            
            // Update all daily snacks that reference indices after the removed one
            Object.keys(dailySnacks).forEach(date => {
                dailySnacks[date] = dailySnacks[date]
                    .filter(s => s.index !== index) // Remove this snack
                    .map(s => ({ index: s.index > index ? s.index - 1 : s.index })); // Adjust indices
            });
            saveToProfile('dailySnacks', dailySnacks);
            
            render();
            addSnackToDay(dateKey); // Reopen modal
        }

        // Remove snack
        window.removeSnack = function(dateKey, snackIdx) {
            if (dailySnacks[dateKey]) {
                dailySnacks[dateKey].splice(snackIdx, 1);
                saveToProfile('dailySnacks', dailySnacks);
                
                closeSnackModal();
                render();
                showSnackManager(dateKey);
            }
        }

        // Toggle meal as eaten
        window.toggleMealEaten = function(dateKey, mealType) {
            if (!eatenMeals[dateKey]) {
                eatenMeals[dateKey] = { breakfast: false, lunch: false, dinner: false, evening: false, snack: false };
            }
            
            eatenMeals[dateKey][mealType] = !eatenMeals[dateKey][mealType];
            saveToProfile('eatenMeals', eatenMeals);
            render();
        }

        // Change meal alternative
        window.changeMeal = function(day, mealType) {
            const alternatives = mealAlternatives[mealType];
            const currentIndex = currentMealSelections[day][mealType];
            
            let optionsHtml = alternatives.map((alt, index) => {
                const bgColor = index === currentIndex ? '#e0f2fe' : 'white';

        // Show shopping list
        window.showShoppingList = function() {
            const allIngredients = [];
            const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            
            days.forEach(day => {
                const breakfastMeal = mealAlternatives.breakfast[currentMealSelections[day].breakfast];
                const lunchMeal = mealAlternatives.lunch[currentMealSelections[day].lunch];
                const dinnerMeal = mealAlternatives.dinner[currentMealSelections[day].dinner];
                const eveningMeal = mealAlternatives.evening[currentMealSelections[day].evening];
                const snackMeal = mealAlternatives.snack[currentMealSelections[day].snack];
                
                allIngredients.push(...breakfastMeal.ingredients);
                allIngredients.push(...lunchMeal.ingredients);
                allIngredients.push(...dinnerMeal.ingredients);
                allIngredients.push(...eveningMeal.ingredients);
                allIngredients.push(...snackMeal.ingredients);
            });
            
            // Define store departments with keywords
            const departments = {
                'Mejeri': ['ägg', 'mjölk', 'smör', 'ost', 'kvarg', 'cottage cheese', 'grädde', 'crème fraiche', 'yoghurt'],
                'Kött & Chark': ['kyckling', 'biff', 'fläsk', 'köttfärs', 'skinka', 'bacon', 'korv', 'falukorv'],
                'Fisk & Skaldjur': ['lax', 'tonfisk', 'räkor'],
                'Frukt & Grönt': ['avokado', 'broccoli', 'blomkål', 'paprika', 'spenat', 'sallad', 'tomat', 'gurka', 'lök', 'vitlök', 'grönsaker', 'bär', 'blåbär', 'citron'],
                'Fryst': ['edamamebönor', 'frysta'],
                'Skafferi': ['olivolja', 'olja', 'tomatpuré', 'salt', 'peppar', 'kanel', 'timjan', 'honung'],
                'Hälsokost': ['proteinpulver', 'mandelmjöl', 'chiafrön', 'kokos', 'mandelmjölk', 'nötter', 'mandlar', 'cashewnötter'],
                'Snacks & Godis': ['choklad']
            };
            
            // Group and sum ingredients
            const ingredientTotals = {};
            
            allIngredients.forEach(ing => {
                // Try to extract number and unit
                const match = ing.match(/^(\d+(?:[.,]\d+)?)\s*([a-zåäöA-ZÅÄÖ]+)\s+(.+)$/);
                
                if (match) {
                    const amount = parseFloat(match[1].replace(',', '.'));
                    const unit = match[2];
                    const name = match[3];
                    const key = `${unit} ${name}`;
                    
                    if (!ingredientTotals[key]) {
                        ingredientTotals[key] = { amount: 0, unit: unit, name: name, original: ing };
                    }
                    ingredientTotals[key].amount += amount;
                } else {
                    // No number found, just count occurrences
                    if (!ingredientTotals[ing]) {
                        ingredientTotals[ing] = { count: 0, original: ing };
                    }
                    ingredientTotals[ing].count = (ingredientTotals[ing].count || 0) + 1;
                }
            });
            
            // Categorize ingredients by department
            const categorizedIngredients = {};
            Object.keys(departments).forEach(dept => {
                categorizedIngredients[dept] = [];
            });
            categorizedIngredients['Övrigt'] = [];
            
            Object.entries(ingredientTotals).forEach(([key, data]) => {
                const searchText = (data.name || key).toLowerCase();
                let assigned = false;
                
                for (const [dept, keywords] of Object.entries(departments)) {
                    if (keywords.some(keyword => searchText.includes(keyword.toLowerCase()))) {
                        categorizedIngredients[dept].push({ key, data });
                        assigned = true;
                        break;
                    }
                }
                
                if (!assigned) {
                    categorizedIngredients['Övrigt'].push({ key, data });
                }
            });
            
            // Build HTML list by department
            let listHtml = '';
            let listText = "HANDLINGSLISTA - VECKA\n\n";
            
            Object.entries(categorizedIngredients).forEach(([dept, items]) => {
                if (items.length === 0) return; // Skip empty departments
                
                listHtml += `
                    <div style="background: #f0fdf4; padding: 12px 20px; border-bottom: 2px solid #10b981;">
                        <h3 style="margin: 0; color: #059669; font-size: 1.1em;">📍 ${dept}</h3>
                    </div>
                `;
                
                listText += `📍 ${dept.toUpperCase()}\n`;
                
                items.sort((a, b) => a.key.localeCompare(b.key)).forEach(({ key, data }) => {
                    let displayText = '';
                    if (data.amount !== undefined) {
                        const formattedAmount = data.amount % 1 === 0 ? data.amount : data.amount.toFixed(1);
                        displayText = `${formattedAmount}${data.unit} ${data.name}`;
                    } else {
                        displayText = key;
                    }
                    
                    listHtml += `
                        <div id="shop-item-${dept.replace(/\s/g, '-')}-${items.indexOf({ key, data })}" onclick="toggleShoppingItem(this)" style="padding: 12px 20px; border-bottom: 1px solid #e5e7eb; cursor: pointer; transition: all 0.2s;">
                            <span style="color: #1f2937;">☐ ${displayText}</span>
                        </div>
                    `;
                    
                    listText += `  ☐ ${displayText}\n`;
                });
                
                listText += '\n';
            });
            
            const modal = `
                <div id="shoppingListModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;" onclick="closeShoppingListModal()">

                        </div>

                            ${listHtml}
                        </div>

                            <button onclick="copyShoppingList(${JSON.stringify(listText).replace(/"/g, '&quot;')})" style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 8px;">

        // Calculate calories for strength training
        function calculateStrengthCalories(exerciseLog) {
            if (!exerciseLog || exerciseLog.length === 0) return 0;
            
            // Check if this is a quick add
            if (exerciseLog[0].isQuickAdd) {
                return exerciseLog[0].targetCalories || 350;
            }
            
            const bodyWeight = userSettings.bodyWeight || 75;
            let totalCalories = 0;
            
            exerciseLog.forEach(exercise => {
                if (!exercise.sets || exercise.sets.length === 0) return;
                
                exercise.sets.forEach(set => {
                    const weight = parseFloat(set.weight) || 0;
                    const reps = parseInt(set.reps) || parseInt(exercise.reps) || 10;
                    
                    // Estimate intensity: higher weight = higher MET
                    const weightRatio = weight / bodyWeight;
                    let met = 3.5;
                    if (weightRatio > 0.6) met = 6.0;
                    else if (weightRatio > 0.3) met = 5.0;
                    
                    // Time per set: roughly 3 seconds per rep + 2 min rest
                    const timePerSetMinutes = ((reps * 3) / 60) + 2;
                    
                    // Calories = MET × weight(kg) × time(hours)
                    const calories = met * bodyWeight * (timePerSetMinutes / 60);
                    totalCalories += calories;
                });
            });
            
            return Math.round(totalCalories);
        }

        // Calculate calories for a single exercise
        function calculateExerciseCalories(exercise) {
            if (!exercise.sets || exercise.sets.length === 0) return 0;
            
            const bodyWeight = userSettings.bodyWeight || 75;
            let totalCalories = 0;
            
            exercise.sets.forEach(set => {
                const weight = parseFloat(set.weight) || 0;
                const reps = parseInt(set.reps) || parseInt(exercise.reps) || 10;
                
                // Estimate intensity
                const weightRatio = weight / bodyWeight;
                let met = 3.5;
                if (weightRatio > 0.6) met = 6.0;
                else if (weightRatio > 0.3) met = 5.0;
                
                // Time per set
                const timePerSetMinutes = ((reps * 3) / 60) + 2;
                
                // Calories = MET × weight(kg) × time(hours)
                const calories = met * bodyWeight * (timePerSetMinutes / 60);
                totalCalories += calories;
            });
            
            return Math.round(totalCalories);
        }

        // Calculate calories for running
        function calculateRunningCalories(exerciseLog) {
            if (!exerciseLog) return 0;
            
            // Use manual calories if provided
            if (exerciseLog.manualCalories && exerciseLog.manualCalories > 0) {
                return Math.round(exerciseLog.manualCalories);
            }
            
            // Otherwise calculate automatically
            if (!exerciseLog.distance || !exerciseLog.time) return 0;
            
            const bodyWeight = userSettings.bodyWeight || 75;
            const distance = parseFloat(exerciseLog.distance);
            const timeMinutes = parseFloat(exerciseLog.time);
            
            // Calculate pace (min/km)
            const pace = timeMinutes / distance;
            
            // MET values based on pace:
            // Slow (>7 min/km): MET 8.0
            // Moderate (5.5-7 min/km): MET 9.0
            // Fast (4.5-5.5 min/km): MET 10.5
            // Very fast (<4.5 min/km): MET 12.0
            let met = 8.0;
            if (pace < 4.5) met = 12.0;
            else if (pace < 5.5) met = 10.5;
            else if (pace < 7) met = 9.0;
            
            // Calories = MET × weight(kg) × time(hours)
            const calories = met * bodyWeight * (timeMinutes / 60);
            
            return Math.round(calories);
        }

        // Calculate total calories for a workout
        function calculateWorkoutCalories(workout) {
            if (workout.type === 'running') {
                return calculateRunningCalories(workout.exerciseLog);
            } else {
                return calculateStrengthCalories(workout.exerciseLog);
            }
        }

                    waistChartData = '<div style="background: #f0fdf4; padding: 15px; border-radius: 10px; margin-bottom: 15px;"><h3 style="margin: 0 0 10px 0; color: #1f2937;">📏 Midjemått</h3>';
                    waistEntries.slice().reverse().slice(0, 10).forEach(entry => {
                        const date = new Date(entry.date).toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
                        const barWidth = Math.min((entry.waist / 150) * 100, 100); // Scale bar
                        waistChartData += `
                            <div style="margin-bottom: 8px;">
                                <div style="display: flex; justify-content: space-between; font-size: 0.85em; color: #6b7280; margin-bottom: 3px;">
                                    <span>${date}</span>
                                    <span style="font-weight: 700; color: #1f2937;">${entry.waist} cm</span>
                                </div>
                                <div style="background: #d1fae5; height: 8px; border-radius: 4px; overflow: hidden;">
                                    <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); height: 100%; width: ${barWidth}%; transition: width 0.3s;"></div>
                                </div>
                            </div>
                        `;
                    });
                    waistChartData += '</div>';
                }
            }
            
            let historyHtml = '<h3 style="margin: 0 0 10px 0; color: #1f2937;">📋 Mäthistorik</h3>';
            if (weightLog.length > 0) {
                weightLog.slice().reverse().forEach((entry, index) => {
                    const date = new Date(entry.date).toLocaleDateString('sv-SE', { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' });
                    historyHtml += `
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="font-weight: 600; color: #1f2937;">${entry.weight} kg ${entry.waist ? `• 📏 ${entry.waist} cm` : ''}</div>
                                <div style="font-size: 0.85em; color: #6b7280;">${date}</div>
                                ${entry.note ? `<div style="font-size: 0.8em; color: #9ca3af; font-style: italic; margin-top: 3px;">${entry.note}</div>` : ''}
                            </div>
                            <button onclick="deleteWeight(${weightLog.length - 1 - index})" style="background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-size: 0.75em; cursor: pointer;">
                                Ta bort
                            </button>
                        </div>
                    `;
                });
            } else {
                historyHtml += '<div style="color: #9ca3af; font-size: 0.9em; font-style: italic;">Ingen vikt loggad än</div>';
            }
            
            const modal = `
                <div id="weightModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; overflow-y: auto;">
                    <div style="background: white; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h2 style="margin: 0; color: #1f2937;">⚖️ Viktutveckling & Mått</h2>
                            <button onclick="closeWeightModal()" style="background: none; border: none; font-size: 1.5em; cursor: pointer; color: #6b7280;">×</button>
                        </div>
                        
                        ${weightsHtml}
                        ${chartData}
                        ${waistChartData}
                        
                        <button onclick="addWeightEntry()" style="width: 100%; margin-bottom: 15px; padding: 14px; background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 1em; cursor: pointer;">
                            + Lägg till ny mätning
                        </button>
                        
                        ${historyHtml}
                        
                        <button onclick="closeWeightModal()" style="width: 100%; margin-top: 15px; padding: 12px; background: #6c757d; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">
                            Stäng
                        </button>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modal);
        }
        
        // Add weight entry
        window.addWeightEntry = function() {
            const weight = parseFloat(prompt('Ange din vikt (kg):'));
            if (!weight || weight <= 0 || isNaN(weight)) {
                return;
            }
            
            const waist = parseFloat(prompt('Ange midjemått i cm (valfritt - tryck Cancel för att hoppa över):'));
            const note = prompt('Notering (valfritt):') || '';
            
            const entry = {
                weight: weight,
                date: new Date().toISOString(),
                note: note
            };
            
            // Add waist measurement if provided
            if (waist && waist > 0 && !isNaN(waist)) {
                entry.waist = waist;
            }
            
            weightLog.push(entry);
            
            // Update userSettings with latest weight
            userSettings.bodyWeight = weight;
            saveToProfile('userSettings', userSettings);
            saveToProfile('weightLog', weightLog);
            
            closeWeightModal();
            showWeightTracking();
        }
        
        // Delete weight entry
        window.deleteWeight = function(index) {
            if (confirm('Ta bort denna vägning?')) {
                weightLog.splice(index, 1);
                saveToProfile('weightLog', weightLog);
                closeWeightModal();
                showWeightTracking();
            }
        }
        
        // Close weight modal
        window.closeWeightModal = function() {
            const modal = document.getElementById('weightModal');
            if (modal) {
                modal.remove();
            }
        }

        // Initialize app
        loadWorkouts();
        render();

        // Close modal when clicking outside
        window.onclick = function(event) {
            const editModal = document.getElementById('editModal');
            if (event.target === editModal) {
                closeModal();
            }
        }
    </script>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Redigera träning</h2>
                <p id="modalDate"></p>
            </div>
            
            <div id="existingWorkouts"></div>
            
            <h3 style="color: #1f2937; font-size: 1.1em; margin-bottom: 10px;">Lägg till träning:</h3>
            <div class="modal-buttons">
                <button class="modal-workout-btn" onclick="selectWorkoutTypeInModal('push')">
                    🏋️ Push
                </button>
                <button class="modal-workout-btn" onclick="selectWorkoutTypeInModal('pull')">
                    💪 Pull
                </button>
                <button class="modal-workout-btn" onclick="selectWorkoutTypeInModal('legs')">
                    🦵 Ben
                </button>
                <button class="modal-workout-btn running" onclick="selectWorkoutTypeInModal('running')">
                    🏃 Löpning
                </button>
            </div>
            
            <button class="modal-close" onclick="closeModal()">Stäng</button>
        </div>
    </div>
</body>
</html>
